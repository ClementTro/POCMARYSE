<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Maryse & Co : le carnet de cuisine familial de Maryse. Recettes, planning des repas et liste de courses."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Maryse & Co</title>
    <script>
      // Applique le thème avant le premier affichage pour éviter un flash clair.
      (function () {
        try {
          var choix = localStorage.getItem('maryse-theme');
          var sombre =
            choix === 'sombre' ||
            (choix !== 'clair' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (sombre) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
