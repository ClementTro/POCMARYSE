# Correctifs de sécurité uniquement (ADR 0015).
# `open-pull-requests-limit: 0` coupe les mises à jour de routine : Dependabot n'ouvre une PR que pour une
# faille connue (réglage « Dependabot security updates » du dépôt). Ces PR sont fusionnées seules quand la CI
# est verte (workflows/dependabot-auto-merge.yml), sauf les versions majeures, réservées à une personne technique.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'fix'
      include: scope
