name: Garder Supabase actif

# Un projet Supabase gratuit est mis en pause après environ une semaine sans activité.
# Cet appel hebdomadaire à la fonction ping() l'en empêche, et échoue visiblement si le projet ne répond plus.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Réveiller Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Appeler ping()
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Les variables VITE_SUPABASE_URL et VITE_SUPABASE_ANON_KEY sont absentes du dépôt."
            exit 1
          fi
          code=$(curl --silent --show-error --output reponse.txt --write-out '%{http_code}' \
            --max-time 30 --request POST "${SUPABASE_URL%/}/rest/v1/rpc/ping" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header 'Content-Type: application/json' --data '{}') || code=000
          echo "Réponse HTTP $code : $(cat reponse.txt 2>/dev/null)"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase n'a pas répondu comme prévu (HTTP $code). Projet en pause, ou migration 0002_ping.sql non appliquée ? Voir docs/MAINTENANCE.md."
            exit 1
          fi
